<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(../fonts/anton.woff2)}
@font-face{font-family:Marker;src:url(../fonts/PermanentMarker-Regular.ttf)}
@font-face{font-family:Typer;src:url(../fonts/SpecialElite-Regular.ttf)}

html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====== Valkyra · estilo COLLAGE (zine de papel + tipografía cinética + rotulador) ======
const W = 1080, H = 1920, cv = document.getElementById('c'), X = cv.getContext('2d');
const PAL = { paper: '#F1E6D0', terra: '#C4553A', sage: '#8DA487', mustard: '#E3A738', ink: '#1E1A16', white: '#FBF7EE', gold: '#D9A441' };
const ACC = { paper: 'terra', terra: 'mustard', sage: 'paper', mustard: 'terra', ink: 'mustard' };   // color de *acento* según el fondo
const INKON = { paper: 'ink', terra: 'paper', sage: 'ink', mustard: 'ink', ink: 'paper' };
const S = DATA.script, T = DATA.timing, SC = S.scenes;

// ---------- utilidades ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = (seed, k = 0) => rng(seed * 7919 + k * 104729 + 13)();
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eOutBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const eOutCub = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const STOP = 12; // fps del stop-motion
const sf = t => Math.floor(t * STOP);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sceneAt(t) { for (let i = SC.length - 1; i >= 0; i--) if (t >= T.scenes[i].start) return i; return 0; }
function wordT(i, w) { const ws = T.scenes[i].words; if (!w) return null; const n = norm(w); for (const [x, t] of ws) if (norm(x).startsWith(n)) return t; return T.scenes[i].start; }
function parseRich(s) { return s.split(/(\*[^*]+\*)/).filter(Boolean).map(p => p[0] === '*' ? { t: p.slice(1, -1), a: 1 } : { t: p, a: 0 }); }
function richW(ctx, s) { return parseRich(s).reduce((w, p) => w + ctx.measureText(p.t).width, 0); }
function richDraw(ctx, s, x, y, col, acc) { // centrado en x
  let cx = x - richW(ctx, s) / 2; ctx.textAlign = 'left';
  for (const p of parseRich(s)) { ctx.fillStyle = p.a ? acc : col; ctx.fillText(p.t, cx, y); cx += ctx.measureText(p.t).width; }
}

// ---------- textura de papel (3 variantes que “hierven” a 12 fps) ----------
const GRAIN = [0, 1, 2].map(k => {
  const c = mk(540, 960), g = c.getContext('2d'), im = g.createImageData(540, 960), r = rng(99 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  g.globalAlpha = .08; g.strokeStyle = '#000'; g.lineWidth = 1;          // fibras
  for (let i = 0; i < 260; i++) { const x = r() * 540, y = r() * 960, a = r() * 6.28, l = 6 + r() * 22; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  g.globalAlpha = .05; for (let i = 0; i < 14; i++) { g.fillStyle = r() > .5 ? '#000' : '#fff'; g.beginPath(); g.arc(r() * 540, r() * 960, 40 + r() * 140, 0, 6.28); g.fill(); }
  return c;
});
function grain(ctx, t, a = .2) { ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = a; ctx.drawImage(GRAIN[((sf(t) % 3) + 3) % 3], 0, 0, W, H); ctx.restore(); }

// ---------- papel rasgado ----------
function tornPath(ctx, w, h, seed, j = 7, step = 16) {
  const r = rng(seed); ctx.beginPath();
  for (let x = -w / 2; x <= w / 2; x += step) ctx.lineTo(x, -h / 2 + (r() - .5) * j);
  for (let y = -h / 2; y <= h / 2; y += step) ctx.lineTo(w / 2 + (r() - .5) * j, y);
  for (let x = w / 2; x >= -w / 2; x -= step) ctx.lineTo(x, h / 2 + (r() - .5) * j);
  for (let y = h / 2; y >= -h / 2; y -= step) ctx.lineTo(-w / 2 + (r() - .5) * j, y);
  ctx.closePath();
}
function shadow(ctx, on) { if (on) { ctx.shadowColor = 'rgba(0,0,0,.32)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 7; ctx.shadowOffsetY = 10; } else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = ctx.shadowOffsetY = 0; } }
function tape(ctx, x, y, w, rot, seed) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = .55; ctx.fillStyle = '#efe3b8'; tornPath(ctx, w, 46, seed, 6, 10); ctx.fill(); ctx.restore(); }

// ---------- pegatinas en trama de puntos (halftone) dibujadas con código ----------
// draw(g) pinta la forma en grises (luz = claro); colorFn(g) pinta capas a color que NO llevan trama.
function sticker(w, h, draw, colorFn, cell = 10) {
  const pad = 34, src = mk(w, h), g = src.getContext('2d'); draw(g);
  const d = g.getImageData(0, 0, w, h).data;
  const out = mk(w + pad * 2, h + pad * 2), o = out.getContext('2d');
  // borde blanco de pegatina (dilatación) + sombra
  const mask = mk(w + pad * 2, h + pad * 2), m = mask.getContext('2d');
  const sil = mk(w, h), sg = sil.getContext('2d'); sg.drawImage(src, 0, 0); if (colorFn) colorFn(sg);
  for (let a = 0; a < 6.28; a += .26) m.drawImage(sil, pad + Math.cos(a) * 15, pad + Math.sin(a) * 15);
  m.globalCompositeOperation = 'source-in'; m.fillStyle = PAL.white; m.fillRect(0, 0, mask.width, mask.height);
  const shd = mk(mask.width, mask.height), sh = shd.getContext('2d'); sh.drawImage(mask, 0, 0); sh.globalCompositeOperation = 'source-in'; sh.fillStyle = '#000'; sh.fillRect(0, 0, shd.width, shd.height);
  o.save(); o.filter = 'blur(8px)'; o.globalAlpha = .38; o.drawImage(shd, 9, 12); o.restore();   // sombra suave
  o.drawImage(mask, 0, 0);
  // base de papel dentro de la silueta
  const base = mk(w, h), bg = base.getContext('2d'); bg.drawImage(src, 0, 0); bg.globalCompositeOperation = 'source-in'; bg.fillStyle = '#F6F0E2'; bg.fillRect(0, 0, w, h);
  o.drawImage(base, pad, pad);
  // trama rotada 45°
  o.fillStyle = PAL.ink; const c = Math.cos(.785), s = Math.sin(.785);
  for (let v = -w - h; v < w + h; v += cell) for (let u = -w - h; u < w + h; u += cell) {
    const x = Math.round(u * c - v * s + w / 2), y = Math.round(u * s + v * c + h / 2);
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const k = (y * w + x) * 4; if (d[k + 3] < 140) continue;
    const L = (d[k] * .3 + d[k + 1] * .59 + d[k + 2] * .11) / 255, r = cell * .62 * Math.sqrt(1 - L);
    if (r > .5) { o.beginPath(); o.arc(x + pad, y + pad, r, 0, 6.28); o.fill(); }
  }
  if (colorFn) { o.save(); o.translate(pad, pad); colorFn(o); o.restore(); }
  return out;
}
const OBJ = {};
function lg(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr; }
function rg(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr; }
function cigBody(g, x, y, L, Hh, withAsh = true) {
  const f = L * .28;
  g.fillStyle = lg(g, 0, y, 0, y + Hh, [[0, '#9a9a9a'], [.35, '#c9c9c9'], [1, '#4a4a4a']]); g.fillRect(x, y, f, Hh);             // filtro
  const r = rng(5); g.fillStyle = 'rgba(40,40,40,.5)'; for (let i = 0; i < 90; i++) g.fillRect(x + r() * f, y + r() * Hh, 3, 3);
  g.fillStyle = lg(g, 0, y, 0, y + Hh, [[0, '#d8d8d8'], [.3, '#ffffff'], [1, '#7a7a7a']]); g.fillRect(x + f, y, L - f, Hh);         // papel
  g.fillStyle = '#6a6a6a'; g.fillRect(x + f - 3, y, 6, Hh);
  if (withAsh) { g.fillStyle = lg(g, 0, y, 0, y + Hh, [[0, '#555'], [.5, '#8a8a8a'], [1, '#2a2a2a']]); g.fillRect(x + L - 34, y, 34, Hh); }
}
function build() {
  OBJ.cigarro = sticker(640, 110, g => cigBody(g, 10, 20, 620, 72), g => { g.fillStyle = rg(g, 622, 56, 0, 30, [[0, '#ffd27a'], [.4, '#ff6a2a'], [1, 'rgba(255,60,20,0)']]); g.beginPath(); g.arc(622, 56, 30, 0, 6.28); g.fill(); });
  OBJ.reloj = sticker(520, 600, g => {
    g.fillStyle = lg(g, 0, 0, 0, 160, [[0, '#d0d0d0'], [1, '#3a3a3a']]);
    [[120, 110], [400, 110]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 78, Math.PI, 0); g.fill(); });
    g.fillStyle = '#555'; g.fillRect(250, 40, 20, 60); g.beginPath(); g.arc(260, 40, 22, 0, 6.28); g.fill();
    g.fillStyle = '#333'; g.save(); g.translate(130, 530); g.rotate(.5); g.fillRect(-14, 0, 28, 70); g.restore(); g.save(); g.translate(390, 530); g.rotate(-.5); g.fillRect(-14, 0, 28, 70); g.restore();
    g.fillStyle = rg(g, 220, 290, 30, 240, [[0, '#ffffff'], [.75, '#d9d9d9'], [1, '#8a8a8a']]); g.beginPath(); g.arc(260, 330, 230, 0, 6.28); g.fill();
    g.lineWidth = 26; g.strokeStyle = lg(g, 0, 100, 0, 560, [[0, '#9a9a9a'], [1, '#222']]); g.stroke();
    g.fillStyle = '#222'; for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; g.save(); g.translate(260 + Math.cos(a) * 180, 330 + Math.sin(a) * 180); g.rotate(a); g.fillRect(-14, -5, k % 3 ? 18 : 34, k % 3 ? 10 : 14); g.restore(); }
  });
  OBJ.huella = sticker(110, 240, g => {
    g.fillStyle = lg(g, 0, 0, 110, 240, [[0, '#8a8a8a'], [1, '#2a2a2a']]);
    g.beginPath(); g.ellipse(55, 70, 48, 68, 0, 0, 6.28); g.fill(); g.beginPath(); g.ellipse(58, 192, 36, 44, 0, 0, 6.28); g.fill();
    g.strokeStyle = '#ddd'; g.lineWidth = 5; for (let y = 30; y < 120; y += 22) { g.beginPath(); g.moveTo(20, y); g.lineTo(90, y + 6); g.stroke(); }
  }, null, 8);
  OBJ.vaso = sticker(360, 520, g => {
    g.beginPath(); g.moveTo(30, 40); g.lineTo(330, 40); g.lineTo(290, 500); g.lineTo(70, 500); g.closePath();
    g.fillStyle = lg(g, 30, 0, 330, 0, [[0, '#c8c8c8'], [.25, '#ffffff'], [.6, '#e8e8e8'], [1, '#9a9a9a']]); g.fill();
    g.save(); g.clip(); g.fillStyle = lg(g, 0, 150, 0, 500, [[0, 'rgba(120,120,120,.55)'], [1, 'rgba(60,60,60,.75)']]); g.fillRect(0, 150, 360, 400);
    const r = rng(8); for (let i = 0; i < 5; i++) { g.save(); g.translate(110 + r() * 140, 120 + i * 70 + r() * 20); g.rotate(r() * 1.2); g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(-46, -40, 92, 80); g.strokeStyle = '#555'; g.lineWidth = 6; g.strokeRect(-46, -40, 92, 80); g.restore(); }
    g.restore(); g.lineWidth = 8; g.strokeStyle = '#444'; g.beginPath(); g.ellipse(180, 40, 150, 16, 0, 0, 6.28); g.stroke();
  });
  OBJ.libreta = sticker(440, 360, g => {
    g.fillStyle = lg(g, 0, 0, 440, 360, [[0, '#ffffff'], [1, '#bdbdbd']]); g.fillRect(10, 30, 420, 320);
    g.strokeStyle = '#9a9a9a'; g.lineWidth = 4; for (let y = 100; y < 340; y += 40) { g.beginPath(); g.moveTo(30, y); g.lineTo(410, y); g.stroke(); }
    g.fillStyle = '#2a2a2a'; for (let x = 40; x < 420; x += 38) { g.beginPath(); g.arc(x, 32, 13, 0, 6.28); g.fill(); }
  });
  OBJ.lapiz = sticker(380, 60, g => {
    g.fillStyle = lg(g, 0, 0, 0, 60, [[0, '#cfcfcf'], [.5, '#8a8a8a'], [1, '#3a3a3a']]); g.fillRect(70, 10, 300, 40);
    g.fillStyle = '#e6e6e6'; g.beginPath(); g.moveTo(70, 10); g.lineTo(10, 30); g.lineTo(70, 50); g.fill(); g.fillStyle = '#222'; g.beginPath(); g.moveTo(26, 25); g.lineTo(10, 30); g.lineTo(26, 35); g.fill();
  }, null, 7);
  OBJ.collar = sticker(120, 330, g => { g.fillStyle = '#888'; g.fillRect(40, 10, 40, 300); }, g => {
    g.clearRect(0, 0, 120, 330);
    g.fillStyle = lg(g, 40, 0, 80, 0, [[0, '#8a5a12'], [.3, '#f7d58a'], [.55, '#d9a441'], [1, '#6e4609']]);
    g.beginPath(); g.roundRect(38, 40, 44, 280, 22); g.fill(); g.fillStyle = '#b07d22'; g.beginPath(); g.arc(60, 26, 16, 0, 6.28); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(50, 60, 6, 220);
  });
  OBJ.mitadA = sticker(330, 110, g => cigBody(g, 10, 20, 620, 72, false), null);
  OBJ.mitadB = sticker(330, 110, g => { g.save(); g.translate(-300, 0); cigBody(g, 10, 20, 620, 72); g.restore(); },
    g => { g.save(); g.translate(-300, 0); g.fillStyle = 'rgba(80,80,80,1)'; g.fillRect(588, 20, 34, 72); g.restore(); });
  // sello distresseado
}
// ---------- garabatos de rotulador ----------
function scribPts(sh, w, h, seed) {
  const r = rng(seed), P = [];
  if (sh === 'circle') for (let k = 0; k <= 70; k++) { const a = -2.2 + k / 70 * 7.0, rr = 1 + (k / 70) * .08 + (r() - .5) * .03; P.push([Math.cos(a) * w / 2 * rr, Math.sin(a) * h / 2 * rr]); }
  if (sh === 'underline') for (let k = 0; k <= 30; k++) P.push([-w / 2 + k / 30 * w, Math.sin(k / 30 * 9) * h * .3 + (r() - .5) * 4]);
  if (sh === 'arrow-down') { for (let k = 0; k <= 24; k++) P.push([Math.sin(k / 24 * 3) * w * .25, -h / 2 + k / 24 * h]); P.push(null, [-w / 2, h / 2 - 70], [0, h / 2], [w / 2, h / 2 - 80]); }
  if (sh === 'arrow-right') { for (let k = 0; k <= 26; k++) P.push([-w / 2 + k / 26 * w, Math.sin(k / 26 * 3.4) * h * .3]); P.push(null, [w / 2 - 70, -h / 2 + 30], [w / 2, Math.sin(3.4) * h * .3], [w / 2 - 80, h / 2 - 10]); }
  if (sh === 'check') P.push([-w / 2, 0], [-w / 6, h / 2], [w / 2, -h / 2]);
  if (sh === 'tally') { for (let k = 0; k < 4; k++) P.push(null, [-w / 2 + k * w / 7, -h / 2], [-w / 2 + k * w / 7 + 6, h / 2]); P.push(null, [-w / 2 - 20, h / 3], [-w / 2 + 3.4 * w / 7, -h / 3]); P.push(null, [-w / 2 + 5.2 * w / 7, -h / 2], [-w / 2 + 5.2 * w / 7 + 6, h / 2]); }
  if (sh === 'strike') P.push([-w / 2, 6], [w / 2, -6]);
  return P;
}
function scribble(ctx, sh, x, y, w, h, col, frac, seed, t, lw = 15) {
  const P = scribPts(sh, w, h, seed); let segs = [], cur = [];
  for (const p of P) { if (!p) { if (cur.length) segs.push(cur); cur = []; } else cur.push(p); } if (cur.length) segs.push(cur);
  let tot = 0; const lens = segs.map(s => { let l = 0; for (let i = 1; i < s.length; i++) l += Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]); tot += l; return l; });
  let left = tot * frac; const b = sf(t);
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = col; ctx.lineCap = ctx.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    let L = left; ctx.lineWidth = pass ? lw * .45 : lw; ctx.globalAlpha = pass ? .5 : .95;
    segs.forEach((s, si) => { if (L <= 0) return; ctx.beginPath(); ctx.moveTo(s[0][0] + R(b, si) * 3, s[0][1]);
      for (let i = 1; i < s.length && L > 0; i++) { const d = Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]); const f = Math.min(1, L / d);
        ctx.lineTo(s[i - 1][0] + (s[i][0] - s[i - 1][0]) * f + (R(b, i + si * 50) - .5) * 4 + pass * 3, s[i - 1][1] + (s[i][1] - s[i - 1][1]) * f + (R(b + 1, i) - .5) * 4 + pass * 2); L -= d; }
      ctx.stroke(); });
  }
  ctx.restore();
}

// ---------- elementos ----------
function enter(t, ta, D = .22) { return t < ta ? -1 : clamp((t - ta) / D); }
function slamT(ctx, p) { const s = 1 + .5 * (1 - eOutExpo(p)); ctx.scale(s, s); ctx.globalAlpha = clamp(p * 3); }
function boil(t, seed, a = 3, r = .006) { const b = sf(t); return [(R(seed, b) - .5) * a, (R(seed + 1, b) - .5) * a, (R(seed + 2, b) - .5) * r]; }

function drawStrip(ctx, e, bgName, t, p, seed) {
  ctx.font = `${e.size || 70}px Anton`; const w = richW(ctx, e.text) + (e.size || 70) * .9, h = (e.size || 70) * 1.45;
  const col = e.color || 'paper', [bx, by, br] = boil(t, seed);
  ctx.save(); ctx.translate(e.x + bx, e.y + by); ctx.rotate((e.rot || 0) * Math.PI / 180 + br); slamT(ctx, p);
  shadow(ctx, 1); ctx.fillStyle = PAL[col]; tornPath(ctx, w, h, seed, 9, 18); ctx.fill(); shadow(ctx, 0);
  ctx.textBaseline = 'middle'; richDraw(ctx, e.text, 0, h * .04, PAL[INKON[col]], PAL[ACC[col]]);
  if (e.strikeP > 0) scribble(ctx, 'strike', 0, 0, w * .95, 20, PAL.ink, e.strikeP, seed + 5, t, 16);
  ctx.restore();
  tape(ctx, e.x - w / 2 + 20 + bx, e.y - h / 2 + by, 120, -.5, seed + 3);
}
function drawBig(ctx, e, bgName, t, p, seed) {
  const size = e.size || 200, col = PAL[e.color || INKON[bgName]], acc = PAL[ACC[bgName]], [bx, by, br] = boil(t, seed, 2, .003);
  ctx.save(); ctx.translate(e.x + bx, e.y + by); ctx.rotate((e.rot || 0) * Math.PI / 180 + br); slamT(ctx, p);
  ctx.font = `${size}px Anton`; ctx.textBaseline = 'middle';
  // registro desplazado tipo risografía
  const mis = bgName === 'ink' ? PAL.terra : (bgName === 'terra' ? PAL.ink : PAL.mustard);
  ctx.globalAlpha *= .9; richDraw(ctx, e.text.replace(/\*/g, ''), 9, 8, mis, mis); ctx.globalAlpha = clamp(p * 3);
  richDraw(ctx, e.text, 0, 0, col, acc);
  ctx.restore();
}
function drawNote(ctx, e, bgName, t, p, seed) {
  const [bx, by, br] = boil(t, seed, 2.5);
  ctx.save(); ctx.translate(e.x + bx, e.y + by); ctx.rotate((e.rot || 0) * Math.PI / 180 + br);
  ctx.font = `${e.size || 64}px Marker`; ctx.textBaseline = 'middle'; const w = ctx.measureText(e.text).width;
  ctx.beginPath(); ctx.rect(-w / 2 - 20, -200, (w + 40) * eOutCub(p), 400); ctx.clip();
  ctx.fillStyle = PAL[e.color || INKON[bgName]]; ctx.textAlign = 'center'; ctx.fillText(e.text, 0, 0); ctx.restore();
}
function drawTag(ctx, e, bgName, t, p, seed) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate((e.rot || 0) * Math.PI / 180); slamT(ctx, p);
  ctx.font = '34px Typer'; const w = ctx.measureText(e.text).width + 50; shadow(ctx, 1); ctx.fillStyle = PAL.white; tornPath(ctx, w, 66, seed, 5, 12); ctx.fill(); shadow(ctx, 0);
  ctx.fillStyle = PAL.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.text, 0, 2); ctx.restore();
}
function drawNum(ctx, e, bgName, t, p, seed) {
  const [bx, by, br] = boil(t, seed);
  ctx.save(); ctx.translate(e.x + bx, e.y + by); ctx.rotate((e.rot || 0) * Math.PI / 180 + br); slamT(ctx, p);
  shadow(ctx, 1); ctx.fillStyle = PAL.white; ctx.beginPath(); const r = rng(seed); for (let a = 0; a < 6.3; a += .2) ctx.lineTo(Math.cos(a) * (128 + r() * 6), Math.sin(a) * (128 + r() * 6)); ctx.fill(); shadow(ctx, 0);
  ctx.lineWidth = 10; ctx.strokeStyle = PAL.terra; ctx.beginPath(); ctx.arc(0, 0, 104, 0, 6.28); ctx.stroke();
  ctx.font = '150px Anton'; ctx.fillStyle = PAL.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.text, 0, 6);
  ctx.font = '30px Typer'; ctx.fillText('MIN', 0, -78); ctx.restore();
}
const STAMP = {};
function drawStamp(ctx, e, bgName, t, p, seed) {
