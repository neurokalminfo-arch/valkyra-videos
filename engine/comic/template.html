<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====== Valkyra · estilo CÓMIC (viñetas en blanco y negro, trama de puntos, acento dorado) ======
const W = 1080, H = 1920, cv = document.getElementById('c'), X = cv.getContext('2d');
const P = { paper: '#F2EDE1', white: '#FFFDF8', ink: '#151515', gray: '#8D8A84', light: '#D9D4C8', gold: '#D7A332', goldD: '#9E7418', goldL: '#F0CF7A',

const S = DATA.script, T = DATA.timing, SC = S.scenes;
const CAPF = S.capFont || 'Lucky';

// ---------- utilidades ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sceneAt(t) { for (let i = SC.length - 1; i >= 0; i--) if (t >= T.scenes[i].start) return i; return 0; }
function wordT(i, w) { if (w === undefined || w === null) return null; if (typeof w === 'number') return T.scenes[i].start + w; const ws = T.scenes[i].words, n = norm(w);
  for (const [x, t] of ws) if (norm(x).startsWith(n)) return t; return T.scenes[i].start; }

// ---------- texturas ----------
function dotPattern(step, r, col) { const c = mk(step, step), g = c.getContext('2d'); g.fillStyle = col; g.beginPath(); g.arc(step / 2, step / 2, r, 0, 6.28); g.fill();
  g.beginPath(); g.arc(0, 0, r, 0, 6.28); g.arc(step, 0, r, 0, 6.28); g.arc(0, step, r, 0, 6.28); g.arc(step, step, r, 0, 6.28); g.fill(); return X.createPattern(c, 'repeat'); }
const DOTS = dotPattern(14, 2.6, P.ink), DOTSF = dotPattern(10, 1.6, P.ink), DOTSG = dotPattern(12, 2.4, P.goldD), DOTSW = dotPattern(14, 2.4, 'rgba(255,255,255,.55)');
const GRAIN = (() => { const c = mk(540, 960), g = c.getContext('2d'), im = g.createImageData(540, 960), r = rng(5);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 70; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; })();
// sombra de trama dentro del camino actual (gradiente: más denso en un lado)
function shade(ctx, x0, y0, x1, y1, a = .35, pat = DOTS) { ctx.save(); ctx.clip(); const g = ctx.createLinearGradient(x0, y0, x1, y1); ctx.globalAlpha = a; ctx.fillStyle = pat; ctx.fillRect(-3000, -3000, 6000, 6000); ctx.restore(); }

// ---------- caja de texto (arriba) que se escribe al ritmo de la voz ----------
function parseCap(s) { // *oro* ~tachado~
  const out = []; s.replace(/(\*[^*]+\*|~[^~]+~|[^*~]+)/g, m => { if (m[0] === '*') out.push({ t: m.slice(1, -1), a: 'gold' }); else if (m[0] === '~') out.push({ t: m.slice(1, -1), a: 'strike' }); else out.push({ t: m, a: '' }); });

    if (glued) { const m = w.match(/^[.,:;!?…)»]+/)[0]; words[words.length - 1].s = (words[words.length - 1].s || '') + m; w = w.slice(m.length); if (!w) return; } words.push({ w: w.toUpperCase(), a: seg.a, s: '' }); }); }); return words;
}
let CAPS = [];
function buildCaps() { CAPS = SC.map((sc, i) => {
  const words = parseCap(sc.caption || sc.say), tw = T.scenes[i].words, st = T.scenes[i].start, en = T.scenes[i].end_speech;
  const ctx = X; let size = sc.capSize || 70, lines;
  const maxW = 860;
  const fit = (sz, mw) => { ctx.font = `${sz}px ${CAPF}`; const sp = ctx.measureText(' ').width; const ls = [[]]; let lw = 0;
    for (const w of words) { const ww = ctx.measureText(w.w + w.s).width; if (ls[ls.length - 1].length && lw + sp + ww > mw) { ls.push([]); lw = 0; } lw += (lw ? sp : 0) + ww; ls[ls.length - 1].push(w); } return ls; };
  let ok = false; for (let sz = size; sz >= 54; sz -= 2) { lines = fit(sz, 900); if (lines.length <= 2) { size = sz; ok = true; break; } }
  if (!ok) for (; size >= 46; size -= 2) { lines = fit(size, maxW); if (lines.length <= 3) break; }
  const isReal = w => /[0-9A-ZÁÉÍÓÚÑÜ]/i.test(w.w), real = words.filter(isReal);
  if (real.length === tw.length) { let j = 0; words.forEach(w => { w.t = tw[Math.min(j, tw.length - 1)][1]; if (isReal(w)) j++; }); }
  else words.forEach((w, k) => { w.t = st + (en - st) * k / words.length; });
  words.forEach((w, k) => { const nx = words[k + 1] ? words[k + 1].t : en; w.d = clamp(nx - w.t, .08, .3); });

}); }
function caption(ctx, i, t) {

  ctx.fillStyle = P.gold; ctx.fillRect(-12, -12, bw * .55, 18); ctx.fillRect(-12, -12, 18, bh * .6);   // filete dorado

  ctx.fillStyle = P.white; ctx.strokeStyle = P.ink; ctx.lineWidth = 6; ctx.fillRect(0, 0, bw, bh); ctx.strokeRect(0, 0, bw, bh);

    l.forEach(w => { const full = ctx.measureText(w.w).width, fullS = ctx.measureText(w.w + w.s).width, p = i === 0 ? 1 : clamp((t - w.t) / w.d), nch = Math.round(w.w.length * p);

        if (w.a === 'gold') { ctx.fillStyle = P.gold; ctx.fillRect(x - 8, y - c.size * .86, tw + 16, c.size * 1.02); }
        ctx.fillStyle = P.ink; ctx.fillText(txt, x, y);

        if (p >= 1 && w.s) { ctx.fillStyle = P.ink; ctx.fillText(w.s, x + full + (w.a === 'gold' ? 8 : 0), y); } }
      x += fullS + (w.a === 'gold' && w.s ? 8 : 0) + sp; }); });

// ---------- viñetas ----------

  split: [[60, 560, 465, 1110], [555, 560, 465, 1110]],
  stack: [[60, 520, 960, 470], [60, 1020, 960, 650]],
  stack2: [[60, 520, 960, 650], [60, 1200, 960, 470]],
  L: [[60, 520, 430, 600], [520, 520, 500, 600], [60, 1150, 960, 520]],

const VIG = {};

  g.globalAlpha = gold ? .4 : .28; g.fillStyle = gold ? DOTSG : DOTSF; g.fillRect(0, 0, w, h); g.globalAlpha = 1; g.globalCompositeOperation = 'destination-out';

function panelBg(ctx, pn, w, h, t, seed) {

  if (bg === 'speed' || bg === 'burst' || bg === 'gold') { // líneas cinéticas radiales
    const cx = (pn.cx ?? .5) * w, cy = (pn.cy ?? .45) * h, r = rng(seed); ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.floor(t * 12) * .004);
    for (let k = 0; k < 90; k++) { const a = r() * 6.28, r0 = 140 + r() * 260, r1 = 1400, wd = 1 + r() * 4.5;
      ctx.fillStyle = bg === 'gold' ? 'rgba(158,116,24,.45)' : 'rgba(20,20,20,.16)'; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a + wd / 600) * r1, Math.sin(a + wd / 600) * r1); ctx.lineTo(Math.cos(a - wd / 600) * r1, Math.sin(a - wd / 600) * r1); ctx.fill(); }
    ctx.restore(); }
  if (bg === 'dots' || bg === 'speed' || bg === 'gold') ctx.drawImage(vignette(w, h, bg === 'gold'), 0, 0);
  if (bg === 'dark') { ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = DOTSW; ctx.fillRect(0, 0, w, h * .35); ctx.restore(); }
  if (bg === 'sky') { // amanecer: sol, colinas y pájaros
    const hy = (pn.hy ?? .62) * h, sx = (pn.sx ?? .45) * w, rise = pn.rise ? eOutCub(clamp((t - pn._t0) / 1.6)) : 1, sy = hy + 40 - 150 * rise;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, hy); ctx.clip(); ctx.strokeStyle = P.ink; ctx.lineWidth = 7; ctx.lineCap = 'round';
    for (let k = 0; k < 11; k++) { const a = Math.PI + k / 10 * Math.PI; ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * 150, sy + Math.sin(a) * 150); ctx.lineTo(sx + Math.cos(a) * (190 + (k % 2) * 40), sy + Math.sin(a) * (190 + (k % 2) * 40)); ctx.stroke(); }
    ctx.fillStyle = '#FFF6DE'; ctx.beginPath(); ctx.arc(sx, sy, 120, 0, 6.28); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = P.white; ctx.strokeStyle = P.ink; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-10, hy + 30); ctx.quadraticCurveTo(w * .3, hy - 30, w * .62, hy + 10); ctx.quadraticCurveTo(w * .85, hy + 30, w + 10, hy - 10); ctx.lineTo(w + 10, h + 10); ctx.lineTo(-10, h + 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(0, hy, w, h); ctx.clip(); ctx.globalAlpha = .25; ctx.fillStyle = DOTSF; ctx.fillRect(0, hy + 40, w, h); ctx.restore();
    ctx.lineWidth = 4; for (let k = 0; k < 3; k++) { const bx = w * (.15 + k * .09) + Math.sin(t * 2 + k) * 6, by = h * (.18 + k * .05); ctx.beginPath(); ctx.moveTo(bx - 16, by - 6); ctx.quadraticCurveTo(bx - 6, by - 12, bx, by); ctx.quadraticCurveTo(bx + 6, by - 12, bx + 16, by - 6); ctx.stroke(); }
  }
}

  const t0 = pn.at !== undefined ? wordT(i, pn.at) : (i === 0 ? -99 : st + k * .18); pn._t0 = t0; if (t < t0) return;
  const p = clamp((t - t0) / .32), e = eOutBack(p), from = pn.from || (k % 2 ? 'right' : 'left');

  ctx.translate(-w / 2, -h / 2);

  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  panelBg(ctx, pn, w, h, t, i * 50 + k);

  ctx.translate(zx, zy); ctx.scale(zoom, zoom); ctx.translate(-zx, -zy);

  ctx.restore();
  ctx.strokeStyle = P.ink; ctx.lineWidth = 8; ctx.strokeRect(0, 0, w, h);

// ---------- trazos ----------
function ol(ctx, fill, lw = 6) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.strokeStyle = P.ink; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function limb(ctx, pts, wd, fill) { // brazo/pierna con contorno
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
  ctx.strokeStyle = P.ink; ctx.lineWidth = wd + 12; ctx.stroke(); ctx.strokeStyle = fill; ctx.lineWidth = wd; ctx.stroke(); ctx.restore(); }
function hand(ctx, x, y, r = 24, fill = P.skin) { ctx.beginPath(); ctx.ellipse(x, y, r, r * 1.08, 0, 0, 6.28); ol(ctx, fill, 6); }

// ---------- personaje: ella ----------
const POSES = { // [codo, mano] de brazo izquierdo (de ella, a la izquierda de pantalla) y derecho
  stand: [[-128, -600, -132, -472], [128, -600, 132, -472]],
  hips: [[-190, -630, -100, -520], [190, -630, 100, -520]],
  think: [[-120, -600, 60, -585], [140, -640, 26, -800]],
  worry: [[-128, -600, -132, -472], [175, -860, 70, -960]],
  head2: [[-175, -860, -70, -960], [175, -860, 70, -960]],
  shock: [[-150, -690, -78, -840], [150, -690, 78, -840]],
  cover: [[-165, -770, -48, -880], [165, -770, 48, -880]],
  hold: [[-140, -600, -22, -650], [140, -600, 22, -650]],
  point: [[-128, -600, -132, -472], [200, -720, 300, -760]],
  wave: [[-128, -600, -132, -472], [200, -820, 230, -960]],
  stop: [[-128, -600, -132, -472], [210, -760, 250, -820]],
  sit: [[-128, -600, -60, -500], [128, -600, 60, -500]],
  palms: [[-160, -610, -120, -700], [160, -610, 120, -700]],

function drawChica(ctx, e, t, i) {
  const s = e.s || 1, blinkCyc = (t + (e.x || 0) * .01) % 3.7, blink = blinkCyc > 3.55, face = e.face || 'neutral';

  ctx.bezierCurveTo(150, -700, 145, -800, 118, -900); ctx.bezierCurveTo(110, -1010, -110, -1010, -118, -900); ol(ctx, P.ink, 6);

  // cuerpo: blusa
  ctx.beginPath(); ctx.moveTo(-60, -775); ctx.quadraticCurveTo(-112, -765, -112, -720); ctx.lineTo(-86, -560); ctx.quadraticCurveTo(-92, -520, -86, -495); ctx.lineTo(86, -495); ctx.quadraticCurveTo(92, -520, 86, -560); ctx.lineTo(112, -720); ctx.quadraticCurveTo(112, -765, 60, -775); ctx.closePath();

  ctx.strokeStyle = P.ink; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-34, -772); ctx.lineTo(0, -700); ctx.lineTo(34, -772); ctx.stroke(); // cuello en V
  ctx.beginPath(); ctx.moveTo(0, -700); ctx.lineTo(0, -500); ctx.stroke(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-50, -640); ctx.quadraticCurveTo(-40, -600, -52, -560); ctx.stroke(); ctx.beginPath(); ctx.moveTo(52, -650); ctx.quadraticCurveTo(44, -610, 55, -570); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(0, -980); ctx.bezierCurveTo(70, -980, 92, -930, 90, -880); ctx.bezierCurveTo(88, -830, 50, -790, 0, -786); ctx.bezierCurveTo(-50, -790, -88, -830, -90, -880); ctx.bezierCurveTo(-92, -930, -70, -980, 0, -980); ol(ctx, P.skin, 6);

    else { const big = face === 'surprise' || face === 'shock' ? 1.15 : 1; ctx.beginPath(); ctx.ellipse(ex, ey, 17 * big, 22 * big, 0, 0, 6.28); ctx.fillStyle = P.white; ctx.fill(); ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = P.ink; const lx = e.look ? e.look * 4 : 0; ctx.beginPath(); ctx.ellipse(ex + lx, ey + 3, 11 * big, 15 * big, 0, 0, 6.28); ctx.fill(); ctx.fillStyle = P.white; ctx.beginPath(); ctx.arc(ex + lx - 4, ey - 4, 4, 0, 6.28); ctx.fill();
      ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(ex - d * 20, ey - 14); ctx.quadraticCurveTo(ex, ey - 30 * big, ex + d * 24, ey - 18); ctx.stroke(); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(ex + d * 22, ey - 18); ctx.lineTo(ex + d * 30, ey - 26); ctx.stroke(); }
    // cejas

    if (face === 'worry' || face === 'sad') { ctx.moveTo(ex - d * 18, by + (d > 0 ? 0 : 0) - 8); ctx.lineTo(ex + d * 18, by + 6); }
