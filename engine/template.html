<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton.woff2)}
@font-face{font-family:Serif;src:url(fonts/serif-italic.woff2);font-style:italic}
@font-face{font-family:Serif;src:url(fonts/serif.woff2);font-style:normal}
@font-face{font-family:Inter;src:url(fonts/inter-500.woff2);font-weight:500}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(fonts/inter-700.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/inter-800.woff2);font-weight:800}
:root{--bg:#F3EDE3;--dot:#DDD3C4;--ink:#2B2723;--mute:#8F857A;--acc:#B85C3A;--acc2:#7E9270;--gold:#C49A4E;--card:#FFFDF9;--note:#E3E8D6;--blob1:#E9D3C2;--blob2:#D8E0CC}
:root{--cacc:#FFB48A}
body.oficial{--cacc:#F2A93B;--bg:#14171C;--dot:#262B33;--ink:#F3F0E8;--mute:#8A919C;--acc:#F2A93B;--acc2:#58C4A7;--gold:#E8C27A;--card:#1E232B;--note:#F2A93B;--blob1:#1F2A33;--blob2:#2A2420}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);font-family:Inter;color:var(--ink);position:relative}
#dots{position:absolute;inset:0;background-image:radial-gradient(var(--dot) 2.2px,transparent 2.6px);background-size:44px 44px}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75}
#brand{position:absolute;top:262px;left:0;right:0;text-align:center;font:600 26px Inter;letter-spacing:.32em;color:var(--mute);text-transform:uppercase}
#brand i{font:italic 34px Serif;letter-spacing:0;text-transform:none;color:var(--acc)}
.scene{position:absolute;left:140px;right:140px;top:360px;bottom:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kicker{font:600 50px/1.25 Inter;margin-bottom:56px;max-width:800px}
.kicker em{font:italic 64px Serif;color:var(--acc)}
.kicker span{display:inline-block;white-space:pre}
.title{font:132px/0.97 Anton;text-transform:uppercase;letter-spacing:.005em}
.title div{display:block}
.title em{font-style:normal;color:var(--acc)}
.zone{margin-top:64px;width:100%;display:flex;flex-direction:column;align-items:center;gap:26px}
.card{width:100%;display:flex;align-items:center;gap:28px;background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:24px 30px;box-shadow:8px 8px 0 var(--ink);text-align:left}
.card.on{border-color:var(--acc);box-shadow:8px 8px 0 var(--acc)}
.card .n{flex:none;width:76px;height:76px;border-radius:12px;background:var(--ink);color:var(--bg);font:54px/76px Anton;text-align:center}
.card.on .n{background:var(--acc);color:#fff}
.card .t{font:48px/1.05 Anton;text-transform:uppercase}
.card .s{font:500 30px/1.25 Inter;color:var(--mute);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:22px}
.chip{font:700 40px Inter;padding:18px 34px;border-radius:999px;background:var(--card);border:3px solid var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.timer{width:330px;height:330px;border-radius:50%;border:6px solid var(--ink);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer b{font:110px/1 Anton}.timer small{font:500 28px Inter;color:var(--mute);margin-top:10px}
.note{width:560px;padding:56px 50px 50px;background:var(--note);box-shadow:0 22px 40px rgba(0,0,0,.18);position:relative;font:italic 60px/1.12 Serif;color:#2B2723}
.note em{color:var(--acc)} body.oficial .note em{color:#14171C;text-decoration:underline}
.note:before{content:"";position:absolute;top:20px;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--acc)}
body.oficial .note:before{background:#14171C}
.vs{width:100%;display:flex;flex-direction:column;gap:22px}
.vs .row{display:flex;align-items:center;gap:22px;font:700 46px Inter;background:var(--card);border-radius:18px;padding:26px 32px;text-align:left}
.vs .row.no{color:var(--mute);text-decoration:line-through;text-decoration-thickness:5px}
.vs .row.si{border:4px solid var(--acc)}
.vs .tag{flex:none;font:34px Anton;padding:6px 16px;border-radius:8px;background:var(--mute);color:var(--bg);text-decoration:none}
.vs .si .tag{background:var(--acc);color:#fff}
.big{font:300px/0.9 Anton;color:var(--acc)}
.bigsub{font:600 40px Inter;color:var(--mute)}
.cta{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.cta .btn{display:flex;align-items:center;gap:18px;font:800 44px Inter;padding:22px 40px;border-radius:999px;background:var(--card);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.cta .btn.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:6px 6px 0 var(--ink)}
body.oficial .cta .btn.on{color:#14171C}
.cta .ic{font-size:46px}
body.cover .title{font-size:168px;line-height:.95}
body.cover .kicker{font-size:56px}
body.cover .scene{top:300px;bottom:300px}
#cine{position:absolute;inset:0;width:1080px;height:1920px}
body.oncine #brand{color:rgba(255,255,255,.75)} body.oncine #brand i{color:var(--cacc)} body.oncine #prog{background:rgba(255,255,255,.22)} body.oncine #prog i{background:var(--cacc)}
.scene.cine{color:#FFFFFF;--ink:#FFFFFF;--card:rgba(10,10,24,.55);--mute:#E2DAD2;--acc:var(--cacc);--note:#FFF4E2;top:640px}
.scene.cine .title{font-size:118px;text-shadow:0 8px 40px rgba(0,0,0,.55)}
.scene.cine .kicker{text-shadow:0 4px 20px rgba(0,0,0,.6)}
.scene.cine.capon .kicker{display:none}
.scene.cine .card,.scene.cine .chip,.scene.cine .cta .btn,.scene.cine .vs .row{box-shadow:0 10px 40px rgba(0,0,0,.35);border-color:rgba(255,255,255,.85)}
.scene.cine .card.on,.scene.cine .chip.on,.scene.cine .cta .btn.on{border-color:var(--acc)}
.scene.cine .card .n{color:#14171C} .scene.cine .chip.on,.scene.cine .cta .btn.on,.scene.cine .card.on .n{color:#14171C}
#cap{position:absolute;top:390px;left:80px;right:80px;text-align:center;font:700 60px/1.28 Inter;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6);display:none}
#cap span{display:inline-block;margin:0 .14em;padding:0 .12em;border-radius:10px;transition:none}
#cap .f{opacity:.38;font-weight:500} #cap .p{opacity:.95} #cap .c{opacity:1;font-weight:800;outline:4px solid var(--cacc);outline-offset:2px}
body:not(.oncine) #cap{color:var(--ink);text-shadow:none}
#prog{position:absolute;top:226px;left:300px;right:300px;height:6px;border-radius:3px;background:var(--dot);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--acc)}
body.cover #prog{display:none}
svg{overflow:visible} svg.guy{overflow:hidden}
.when{font:700 34px Inter;letter-spacing:.06em;padding:12px 26px;border-radius:999px;background:var(--acc);color:#14171C}
</style></head>
<body>
<div id="dots"></div>
<div class="blob" id="b1" style="width:700px;height:700px;background:var(--blob1)"></div>
<div class="blob" id="b2" style="width:640px;height:640px;background:var(--blob2)"></div>
<canvas id="cine" width="1080" height="1920"></canvas>
<div id="brand"></div>
<div id="prog"><i></i></div>
<div id="stage"></div>
<div id="cap"></div>
<script src="cine.js"></script>
<script>
const D = window.DATA;
document.body.className = D.script.account;
document.getElementById('brand').innerHTML = D.script.account === 'calma' ? 'calma · <i>valkyra</i>' : '<i>valkyra</i> · oficial';
const em = s => s.replace(/\*(.+?)\*/g, '<em>$1</em>');
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// subtítulos palabra a palabra (estilo cinemático): por defecto en las escenas con fondo "bg"; "captions":"all" los pone en todas, false los quita
const capOn = s => D.script.captions !== false && D.script.cover !== true && (D.script.captions === 'all' || !!s.bg);
function chunks(words) { const out = []; let cur = []; words.forEach((w, k) => { if (cur.length && (cur.length >= 4 || w[1] - words[k - 1][1] > 0.55)) { out.push(cur); cur = []; } cur.push(w); }); if (cur.length) out.push(cur); return out; }
let PID = 0;
function pendant() {
  const pid = 'pg' + (PID++); // collar Valkyra dibujado (cadena + tubo)
  return `<svg width="320" height="420" viewBox="0 0 320 420">
   <defs><linearGradient id="${pid}" x1="0" x2="1"><stop offset="0" stop-color="#9C7836"/><stop offset=".45" stop-color="#F3D99A"/><stop offset="1" stop-color="#A9843F"/></linearGradient></defs>
   <path d="M20 0 Q160 260 300 0" fill="none" stroke="url(#${pid})" stroke-width="6" stroke-dasharray="10 6"/>
   <circle cx="160" cy="130" r="12" fill="none" stroke="url(#${pid})" stroke-width="6"/>
   <rect x="138" y="142" width="44" height="230" rx="22" fill="url(#${pid})"/>
   <rect x="150" y="150" width="6" height="210" rx="3" fill="#fff" opacity=".55"/>
   <ellipse cx="160" cy="372" rx="12" ry="5" fill="#5a4520"/></svg>`;
}

// protagonista de @valkyra.oficial (chico joven, dibujado con codigo). poses: wave, breath, think, coffee, phone
let GID = 0;
function guy(pose) {
  const gid = 'gg' + (GID++);
  const skin = '#D9A07E', skinD = '#B97E5E', hair = '#2A1E17', hood = '#58C4A7', hoodD = '#3C9C84';
  const arm = {
    wave: `<path d="M300 520 Q350 400 340 300" stroke="${hood}" stroke-width="64" fill="none" stroke-linecap="round"/><g class="wv"><ellipse cx="338" cy="270" rx="34" ry="40" fill="${skin}"/><rect x="316" y="214" width="12" height="40" rx="6" fill="${skin}"/><rect x="332" y="208" width="12" height="44" rx="6" fill="${skin}"/><rect x="348" y="214" width="12" height="40" rx="6" fill="${skin}"/></g>`,
    breath: `<path d="M150 540 Q130 390 200 318" stroke="${hood}" stroke-width="64" fill="none" stroke-linecap="round"/><ellipse cx="200" cy="312" rx="30" ry="26" fill="${skin}"/><rect x="193" y="244" width="14" height="66" rx="7" fill="url(#${gid})"/><path d="M200 300 Q150 360 172 380" stroke="url(#${gid})" stroke-width="4" fill="none" stroke-dasharray="6 4"/>`,
    think: `<path d="M140 520 Q120 400 190 330" stroke="${hood}" stroke-width="64" fill="none" stroke-linecap="round"/><ellipse cx="196" cy="318" rx="30" ry="26" fill="${skin}"/>`,
    coffee: `<path d="M140 520 Q110 440 170 390" stroke="${hood}" stroke-width="64" fill="none" stroke-linecap="round"/><rect x="150" y="330" width="70" height="80" rx="10" fill="#F3F0E8"/><path d="M220 350 q30 0 30 25 q0 25 -30 25" stroke="#F3F0E8" stroke-width="10" fill="none"/><path class="st" d="M170 315 q10 -20 0 -40 M195 315 q10 -20 0 -40" stroke="#8A919C" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="160" cy="380" rx="28" ry="24" fill="${skin}"/>`,
    phone: `<path d="M140 520 Q110 440 175 380" stroke="${hood}" stroke-width="64" fill="none" stroke-linecap="round"/><rect x="160" y="300" width="56" height="96" rx="10" fill="#0E1116" stroke="#3a3f48" stroke-width="4"/><rect x="167" y="310" width="42" height="72" rx="4" fill="#58C4A7" opacity=".6"/><ellipse cx="180" cy="385" rx="28" ry="24" fill="${skin}"/>`
  }[pose || 'wave'];
  const mouth = pose === 'breath' ? `<ellipse cx="200" cy="246" rx="9" ry="7" fill="#7A3B2E"/>` : pose === 'think' ? `<path d="M186 248 q14 -6 28 0" stroke="#7A3B2E" stroke-width="6" fill="none" stroke-linecap="round"/>` : `<path d="M180 240 q20 18 40 0" stroke="#7A3B2E" stroke-width="6" fill="#fff" stroke-linecap="round"/>`;
  return `<svg class="guy" width="400" height="540" viewBox="0 0 400 540">
   <defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="#9C7836"/><stop offset=".45" stop-color="#F3D99A"/><stop offset="1" stop-color="#A9843F"/></linearGradient></defs>
   <g class="bob">
   <path d="M40 540 Q50 380 200 360 Q350 380 360 540 Z" fill="${hood}"/>
   <path d="M150 372 Q200 420 250 372" stroke="${hoodD}" stroke-width="14" fill="none"/>
   <rect x="176" y="290" width="48" height="80" rx="20" fill="${skinD}"/>
   ${pose === 'breath' ? '' : `<path d="M168 372 Q200 440 232 372" stroke="url(#${gid})" stroke-width="4" fill="none" stroke-dasharray="6 4"/><rect x="193" y="420" width="14" height="56" rx="7" fill="url(#${gid})"/>`}
   <ellipse cx="200" cy="200" rx="92" ry="108" fill="${skin}"/>
   <ellipse cx="108" cy="210" rx="16" ry="24" fill="${skinD}"/><ellipse cx="292" cy="210" rx="16" ry="24" fill="${skinD}"/>
   <path d="M108 190 Q100 80 200 78 Q300 74 296 180 Q280 120 230 128 Q170 98 120 150 Z" fill="${hair}"/>
   <path d="M120 250 Q200 330 280 250 Q275 300 200 310 Q125 300 120 250Z" fill="${hair}" opacity=".18"/>
   <path d="M146 166 q22 -12 44 0 M212 166 q22 -12 44 0" stroke="${hair}" stroke-width="9" fill="none" stroke-linecap="round"/>
   <g class="eyes"><ellipse cx="168" cy="196" rx="10" ry="12" fill="#1b1410"/><ellipse cx="234" cy="196" rx="10" ry="12" fill="#1b1410"/></g>
   <path d="M200 205 q-8 22 4 26" stroke="${skinD}" stroke-width="5" fill="none" stroke-linecap="round"/>
   ${mouth}
   ${arm}</g></svg>`;
}

// ---- construir escenas ----
const scenes = D.script.scenes.map((s, i) => {
  const T = D.timing.scenes[i];
  const el = document.createElement('div'); el.className = 'scene' + (s.bg ? ' cine' : '') + (capOn(s) ? ' capon' : ''); el.style.opacity = 0;
  let h = '';
  if (s.kicker) h += `<div class="kicker">${em(s.kicker).split(/(<em>.*?<\/em>|\s+)/).filter(x=>x&&x.trim()).map(w=>`<span>${w} </span>`).join('')}</div>`;
  if (s.title) h += `<div class="title">${s.title.map(l => `<div>${em(l)}</div>`).join('')}</div>`;
  const z = s.zone; let items = [];
  if (z) {
    h += '<div class="zone">';
    if (z.type === 'steps') h += z.items.map(it => `<div class="card it"><div class="n">${it.n}</div><div><div class="t">${it.t}</div>${it.s ? `<div class="s">${it.s}</div>` : ''}</div></div>`).join('');
    if (z.type === 'chips') h += `<div class="chips">${z.items.map(it => `<div class="chip it">${it.t}</div>`).join('')}</div>`;
    if (z.type === 'timer') h += `<div class="timer it"><b>0:00</b><small>${z.label || ''}</small></div>`;
    if (z.type === 'note') h += `<div class="note it">${em(z.text)}</div>`;
    if (z.type === 'cta') h += `<div class="cta">${z.items.map(it => `<div class="btn it"><span class="ic">${{follow:'＋',like:'♥',comment:'💬',save:'🔖',share:'↗'}[it.icon] || ''}</span>${em(it.t)}</div>`).join('')}</div>`;
    if (z.type === 'pendant') h += `<div class="it">${pendant()}</div>`;
    // el avatar se ha retirado (13-11-2026): 'guy' y 'moment' solo muestran la etiqueta del momento del día
    if (z.type === 'guy' || z.type === 'moment') h += z.label ? `<div class="when it">${z.label}</div>` : '';
    if (z.type === 'vs') h += `<div class="vs">${z.items.map(it => `<div class="row it ${it.k}"><span class="tag">${it.k === 'no' ? 'ANTES' : 'AHORA'}</span>${it.t}</div>`).join('')}</div>`;
    if (z.type === 'big') h += `<div class="big it">${z.text}</div><div class="bigsub it">${z.sub || ''}</div>`;
    h += '</div>';
  }
  el.innerHTML = h; document.getElementById('stage').appendChild(el);
  // tiempos de aparicion de cada item (palabra clave 'at' o escalonado)
  const its = [...el.querySelectorAll('.it')];
  const defs = z ? (z.items || its.map(() => z)) : [];
  let wi = 0;
  const times = its.map((_, k) => {
    const at = (defs[k] || {}).at;
    if (at && !z.items && k > 0) return null;
    if (at) { for (let j = wi; j < T.words.length; j++) if (T.words[j][0].toLowerCase() === at.toLowerCase()) { wi = j + 1; return T.words[j][1] - 0.08; } }
    return T.start + 0.7 + k * 0.45;
  });
  for (let k = 1; k < times.length; k++) if (times[k] === null) times[k] = times[0] + 0.15 * k;
  return { el, s, T, its, times, ch: chunks(T.words || []), kick: [...el.querySelectorAll('.kicker span')], lines: [...el.querySelectorAll('.title div')] };
});

// tramos de fondo: escenas seguidas con el mismo tipo de fondo comparten un solo plano continuo
const RUNS = [];
D.script.scenes.forEach((s, i) => { const T = D.timing.scenes[i]; if (!s.bg) return; const L = RUNS[RUNS.length - 1];
  if (L && L.last === i - 1 && L.bg.type === s.bg.type) { L.last = i; L.end = T.end; } else RUNS.push({ bg: s.bg, first: i, last: i, start: T.start, end: T.end }); });
const cineCv = document.getElementById('cine'), capEl = document.getElementById('cap'); let capKey = '';
window.render = function (t) {
  const nS = D.script.scenes.length;
  RUNS.forEach(R => { const fin = R.last === nS - 1, ini = R.first === 0;
    R.alpha = (ini ? 1 : clamp((t - R.start + 0.1) / 0.45)) * (fin ? 1 : clamp((R.end - t) / 0.35)) * ((ini || t >= R.start - 0.1) && (fin || t < R.end) ? 1 : 0);
    R.lt = Math.max(0, t - R.start); R.zoom = 1 + 0.07 * clamp(R.lt / Math.max(2, R.end - R.start)); });
  CINE.draw(cineCv, Math.max(0, t), RUNS);
  document.body.classList.toggle('oncine', RUNS.some(R => R.alpha > 0.5));
  let capShown = false;
  document.getElementById('b1').style.transform = `translate(${-180 + 60 * Math.sin(t * .25)}px,${180 + 50 * Math.cos(t * .2)}px)`;
  document.getElementById('b2').style.transform = `translate(${560 + 50 * Math.cos(t * .22)}px,${1180 + 60 * Math.sin(t * .18)}px)`;
  document.querySelectorAll('.guy').forEach(g => {
    g.querySelector('.bob').style.transform = `translateY(${6 * Math.sin(t * 2.2)}px)`;
    const bl = (t % 3.1) < 0.12; g.querySelector('.eyes').style.transform = bl ? 'translateY(176px) scaleY(.1) translateY(-176px)' : '';
    g.querySelector('.eyes').style.transformOrigin = '200px 196px'; g.querySelector('.eyes').style.transformBox = 'view-box';
    if (bl) g.querySelector('.eyes').style.transform = 'scaleY(.1)';
    const w = g.querySelector('.wv'); if (w) { w.style.transformOrigin = '338px 300px'; w.style.transformBox = 'view-box'; w.style.transform = `rotate(${14 * Math.sin(t * 7)}deg)`; }
  });
  document.querySelector('#prog i').style.width = (100 * clamp(t / D.timing.duration)) + '%';
  scenes.forEach((S, i) => {
    const { start, end } = S.T; const last = i === scenes.length - 1;
    // la primera escena se ve completa desde el primer fotograma (el gancho no puede tardar en aparecer)
    const a = i === 0 ? Math.max(t, 0) + 1.2 : t - start, out = last ? 0 : clamp((t - (end - 0.22)) / 0.22);
    const vis = (i === 0 || t >= start - 0.05) && (t < end || last);
    S.el.style.display = vis ? 'flex' : 'none'; if (!vis) return;
    if (capOn(S.s) && S.ch.length && t < end) { capShown = true;
      let ci = 0; S.ch.forEach((c, k) => { if (t >= c[0][1] - 0.05) ci = k; });
      const c = S.ch[ci], key = i + ':' + ci + ':' + c.filter(w => t >= w[1] - 0.03).length;
      if (key !== capKey) { capKey = key; let cur = -1; c.forEach((w, k) => { if (t >= w[1] - 0.03) cur = k; });
        capEl.innerHTML = c.map((w, k) => `<span class="${k === cur ? 'c' : k < cur ? 'p' : 'f'}">${w[0]}</span>`).join(' '); }
      capEl.style.opacity = 1 - out; }
    S.el.style.opacity = 1 - out; S.el.style.transform = `translateY(${-40 * ease(out)}px) scale(${1 + 0.035 * clamp((t - start) / Math.max(1, end - start))})`;
    S.kick.forEach((w, k) => { const p = clamp((a - k * 0.07) / 0.25); w.style.opacity = 0.15 + 0.85 * p; w.style.transform = `translateY(${12 * (1 - ease(p))}px)`; });
    const k0 = S.kick.length * 0.07;
    S.lines.forEach((l, k) => { const p = clamp((a - k0 - k * 0.12) / 0.4); l.style.opacity = clamp(p * 2); l.style.transform = `translateY(${50 * (1 - ease(p))}px) scale(${0.9 + 0.1 * back(p)})`; });
    S.its.forEach((it, k) => {
      const p = clamp((t - S.times[k]) / 0.38);
      it.style.opacity = clamp(p * 1.6); it.style.transform = `translateY(${40 * (1 - ease(p))}px) scale(${0.85 + 0.15 * back(p)})`;
      const newest = S.times.filter(x => x <= t).length - 1;
      it.classList.toggle('on', k === newest && S.s.zone.type !== 'vs');
      if (S.s.zone.type === 'timer') { const left = Math.max(0, (S.s.zone.from || 300) - Math.max(0, t - S.times[k]) * (S.s.zone.speed || 20)); it.querySelector('b').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0'); }
    });
  });
  capEl.style.display = capShown ? 'block' : 'none';
};
window.render(0);
</script></body></html>
